name: Build Pushr APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find project folder
        id: find
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          echo "Found: $FILE"
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Pushr.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pushr-APK
          path: Pushr.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pushr build ${{ github.run_number }}
          files: Pushr.apk
